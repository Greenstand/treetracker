replicaCount: 2

image:
  repository: greenstand/treetracker-field-data
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

env:
  - name: DATABASE_URL
    value: "postgresql://treetracker:treetracker@greenstand-postgres:5432/treetracker"
  - name: AWS_ENDPOINT
    value: "http://greenstand-localstack:4566"
  - name: AWS_REGION
    value: "us-east-1"
  - name: AWS_ACCESS_KEY_ID
    value: "test"
  - name: AWS_SECRET_ACCESS_KEY
    value: "test"

resources: {}
