replicaCount: 2

image:
  repository: greenstand/treetracker-admin-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

env:
  - name: DATABASE_URL
    value: "postgresql://treetracker:treetracker@greenstand-postgres:5432/treetracker"
  - name: AUTH_URL
    value: "http://greenstand-treetracker-auth:80"

resources: {}
