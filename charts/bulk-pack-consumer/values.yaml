replicaCount: 2

image:
  repository: greenstand/bulk-pack-consumer
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

env:
  - name: DATABASE_URL
    value: "postgresql://treetracker:treetracker@greenstand-postgres:5432/treetracker"
  - name: AWS_ENDPOINT
    value: "http://greenstand-localstack:4566"
  - name: AWS_REGION
    value: "us-east-1"
  - name: AWS_ACCESS_KEY_ID
    value: "test"
  - name: AWS_SECRET_ACCESS_KEY
    value: "test"
  - name: S3_BUCKET
    value: "treetracker-bulk-pack-local"
  - name: SQS_QUEUE_URL
    value: "http://greenstand-localstack:4566/000000000000/treetracker-bulk-pack"

resources: {}
