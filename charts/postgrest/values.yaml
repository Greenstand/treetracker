replicaCount: 2

image:
  repository: postgrest/postgrest
  tag: v12.0.2
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

env:
  - name: PGRST_DB_URI
    value: "postgresql://treetracker:treetracker@greenstand-postgres:5432/treetracker"
  - name: PGRST_DB_SCHEMA
    value: "public"
  - name: PGRST_DB_ANON_ROLE
    value: "treetracker"
  - name: PGRST_SERVER_PORT
    value: "3000"

resources: {}
