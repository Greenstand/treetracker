# treetracker-data-pipeline consumer — long-running SQS poller. Reads the real-AWS
# treetracker-local-queue (S3 ObjectCreated events), fetches the S3 object, and writes a
# bulk_tree_upload row into the data_pipeline DB. Pods reach AWS directly (no proxy).
# AWS creds come from the `consumer-aws` Secret (created imperatively from ~/.aws; not committed).
apiVersion: v1
kind: Namespace
metadata:
  name: data-pipeline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: data-pipeline
spec:
  replicas: 1
  selector:
    matchLabels: { app: consumer }
  template:
    metadata:
      labels: { app: consumer }
    spec:
      containers:
        - name: consumer
          image: treetracker-data-pipeline-consumer:local
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_INPUT_DB_URL
              value: "postgresql://postgres:postgres@postgres.data.svc.cluster.local:5432/data_pipeline"
            - name: SQS_QUEUE_URL
              value: "https://sqs.eu-central-1.amazonaws.com/053061259712/treetracker-local-queue"
            - name: AWS_REGION
              value: "eu-central-1"
          volumeMounts:
            - name: aws-creds
              mountPath: /app/config/aws.json
              subPath: aws.json
              readOnly: true
      volumes:
        - name: aws-creds
          secret:
            secretName: consumer-aws
