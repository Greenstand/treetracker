apiVersion: v2
name: greenstand
description: Greenstand platform umbrella chart
type: application
version: 0.1.0

dependencies:
  - name: postgresql
    version: "18.6.2"
    repository: https://charts.bitnami.com/bitnami
    alias: postgres
    condition: postgres.enabled

  - name: localstack
    version: "0.7.0"
    repository: https://helm.localstack.cloud
    condition: localstack.enabled

  - name: rabbitmq
    version: "0.1.0"
    repository: "file://charts/rabbitmq"
    condition: rabbitmq.enabled

  - name: airflow
    version: "1.21.0"
    repository: https://airflow.apache.org
    condition: airflow.enabled

  - name: cert-manager
    version: "v1.20.2"
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled

  - name: emissary-ingress
    version: "8.12.2"
    repository: https://app.getambassador.io
    alias: ambassador
    condition: ambassador.enabled

  - name: keycloak
    version: "25.2.0"
    repository: https://charts.bitnami.com/bitnami
    condition: keycloak.enabled

  - name: sealed-secrets
    version: "2.18.5"
    repository: https://bitnami-labs.github.io/sealed-secrets
    condition: sealed-secrets.enabled

  # Auth
  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-auth

  # Core APIs
  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-admin-api

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-field-data

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-wallet-api

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-messaging-api

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-stakeholder-api

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-reporting

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-like

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-api

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-earnings-api

  # Data + Pipeline
  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-grower-account-query

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: images-api

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-tile-server

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-tile-server-next

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-denormalization

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: bulk-pack-consumer

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: bulk-pack-transformer

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: bulk-pack-transformer-v2

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: bulk-pack-processor

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: webmap-query-service-consumer

  # Webmap
  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-query-api

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: postgrest

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: map-config-api

  # Gateway
  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-gateway

  # Clients
  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-admin-client

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-wallet-app

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: treetracker-web-map-client

  - name: service
    version: "0.1.0"
    repository: "file://charts/service"
    alias: wallet-monorepo-user-api
