# Image repo overrides: uses locally built images from the k3d registry.
# Run `make build-all` to populate the registry, then `make upgrade` to redeploy.
# Services without source (treetracker-gateway, wallet-monorepo-user-api,
# treetracker-tile-server-next) are omitted — they stay on their chart defaults.

bulk-pack-consumer:
  image:
    repository: k3d-greenstand-registry:5000/bulk-pack-consumer

bulk-pack-processor:
  image:
    repository: k3d-greenstand-registry:5000/bulk-pack-processor

bulk-pack-transformer:
  image:
    repository: k3d-greenstand-registry:5000/bulk-pack-transformer

# bulk-pack-transformer-v2 uses the same image as bulk-pack-transformer
bulk-pack-transformer-v2:
  image:
    repository: k3d-greenstand-registry:5000/bulk-pack-transformer

