# values/local.yaml — local k3s overrides

postgres:
  primary:
    persistence:
      size: 2Gi
  readReplicas:
    replicaCount: 0

localstack:
  enabled: true
  # Use the OSS image pinned to 3.x; v4+ / date-versioned releases require a license.
  image:
    repository: localstack/localstack
    tag: "3.8.1"
  startServices: "s3,sqs,sns"
  persistence:
    enabled: false
  resources:
    limits:
      memory: 512Mi

rabbitmq:
  enabled: true

# Disabled locally — not needed for service dev and reduce Helm release Secret size.
airflow:
  enabled: false
cert-manager:
  enabled: false
keycloak:
  enabled: false
sealed-secrets:
  enabled: false
# Ambassador/Emissary Ingress is amd64-only; its apiext pod crashes on Apple Silicon
# (arm64) under QEMU emulation. k3d bundles Traefik for ingress on local.
ambassador:
  enabled: false

aws:
  endpoint: "http://greenstand-localstack:4566"
  region: us-east-1
  accessKeyId: test
  secretAccessKey: test

# --- All services: 1 replica locally ---
treetracker-auth:
  replicaCount: 1
treetracker-admin-api:
  replicaCount: 1
treetracker-field-data:
  replicaCount: 1
  env:
    - name: DATABASE_URL
      value: "postgresql://treetracker:treetracker@greenstand-postgres:5432/treetracker"
    - name: DATABASE_URL_LEGACYDB
      value: "postgresql://treetracker:treetracker@greenstand-postgres:5432/treetracker"
    - name: AWS_ENDPOINT
      value: "http://greenstand-localstack:4566"
    - name: AWS_REGION
      value: "us-east-1"
    - name: AWS_ACCESS_KEY_ID
      value: "test"
    - name: AWS_SECRET_ACCESS_KEY
      value: "test"
    - name: RABBIT_MQ_URL
      value: "amqp://treetracker:treetracker@greenstand-rabbitmq:5672"
